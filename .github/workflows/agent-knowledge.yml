name: Agent Knowledge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  maintenance-check:
    name: Require agent and skill synchronization
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate agent knowledge maintenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-agent-knowledge.py --base "$BASE_SHA" --head "$HEAD_SHA"
