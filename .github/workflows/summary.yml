name: Summary CI
permissions:
  contents: write
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Generate README
    runs-on: ubuntu-latest
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Clear GitHub App private key
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] required for Upptime git push (v7.0.1)
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@2e53e7570ad597ccf3f251d43502846a042165d2 # v1.44.0
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
